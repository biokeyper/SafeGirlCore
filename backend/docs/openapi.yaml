      security:
        - bearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report archived
        '404':
          description: Report not found

  /api/report/{reportId}/unarchive:
    post:
      summary: Unarchive report
      operationId: unarchiveReport
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
