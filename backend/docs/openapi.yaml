  # ========== PANIC ALERT ENDPOINTS ==========

  /api/panic-alert:
    post:
      summary: Send panic alert (non-blocking, SMS sent to emergency contacts)
      operationId: sendPanicAlert
      tags: [Panic Alerts]
      security:
        - bearerAuth: []
      description: |
        Returns immediately (<100ms) with alertId. Background processing:
        1. Blockchain confirmation (2-5 sec)
        2. SMS notifications to emergency contacts (rate-limited)
        3. Audit logging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPanicAlertRequest'
      responses:
        '200':
          description: Panic alert sent (background processing continues)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendPanicAlertResponse'
        '429':
          description: Rate limited (10 attempts per minute)

  /api/panic-alert/history:
    get:
      summary: Get panic alert history
      operationId: getPanicHistory
